<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Szene privat: Der Käufer fragt</title>
<!--
  Rahmen des Privatfilms: am Anfang fragt der Kaufinteressent nach dem Serviceheft und der Verkäufer hat keine
  Antwort, am Ende dieselbe Szene mit Antwort: der Verkäufer zeigt das Serviceheft-PDF aus der App auf dem Handy
  (Knopf «Serviceheft für den Verkauf»). Welche Fassung, entscheidet ?antwort=1, die Sprache ?sprache=fr.
  Das Bild skaliert mit der Fläche, damit es im Handy- und im Desktop-Format gleich gross wirkt.
  Aufnahme über e2e/video/zeichnung.video.ts.
-->
<style>
  /* Dunkle Palette wie die App (src/styles/design-tokens.css), Akzent in Wartungsheft-Grün */
  :root {
    --ink: #f3f4f6;
    --muted: #9ca3af;
    --bg: #111827;
    --marke: #059669;
    --marke-hell: #10b981;
    --warn: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: radial-gradient(ellipse at 50% 60%, #1b2638 0%, var(--bg) 70%); }
  body { font-family: 'Segoe UI', system-ui, sans-serif; }

  .stage { position: relative; width: 100vw; height: 100vh; }

  .title {
    position: absolute; top: 9vh; left: 0; right: 0; text-align: center; padding: 0 6vw;
    color: var(--ink); font-size: clamp(24px, 5vmin, 46px); font-weight: 650; line-height: 1.3;
    opacity: 0; animation: fade-in 600ms ease-out 2200ms forwards;
  }

  svg { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); width: min(94vw, 118vh); height: auto; }

  .person { opacity: 0; animation: fade-in 500ms ease-out 200ms forwards; }
  .person.zweite { animation-delay: 450ms; }
  .auto { opacity: 0; animation: rise 700ms cubic-bezier(.2,.8,.3,1) 0ms forwards; }
  .blase { opacity: 0; transform-box: fill-box; transform-origin: 0% 100%; animation: pop 600ms cubic-bezier(.2,.8,.3,1) 1100ms forwards; }
  .blase-text { font-size: 23px; font-weight: 650; fill: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; }
  .zeichen { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: pop 600ms cubic-bezier(.2,.8,.3,1) 1900ms forwards; }
  .handy { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: pop 700ms cubic-bezier(.2,.8,.3,1) 700ms forwards; }
  .handy-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; }

  @keyframes fade-in { to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(10px) scale(.85); }
    100% { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <p class="title" id="titel"></p>

    <svg viewBox="0 0 640 400" aria-hidden="true">
      <!-- Boden und Schatten -->
      <path d="M30 334h580" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="320" cy="333" rx="190" ry="9" fill="#020617" opacity=".55"/>

      <!-- Auto von der Seite, Zierstreifen in der Markenfarbe -->
      <g class="auto">
        <path d="M148 318h344v-44c0-14-10-25-24-25h-38l-46-50a30 30 0 0 0-22-10H250a30 30 0 0 0-22 10l-44 50h-12c-14 0-24 11-24 25z" fill="#e2e8f0"/>
        <path d="M252 202h52v44h-90zM318 202h48l40 44h-88z" fill="#94a3b8"/>
        <path d="M148 286h344" stroke="var(--marke-hell)" stroke-width="6"/>
        <rect x="466" y="258" width="20" height="10" rx="3" fill="#fde68a"/>
        <rect x="152" y="260" width="14" height="9" rx="3" fill="#fca5a5"/>
        <circle cx="222" cy="318" r="27" fill="#1f2937"/><circle cx="222" cy="318" r="11" fill="#cbd5e1"/>
        <circle cx="420" cy="318" r="27" fill="#1f2937"/><circle cx="420" cy="318" r="11" fill="#cbd5e1"/>
      </g>

      <!-- Käufer links, Verkäufer rechts in Markenfarbe: angedeutet, keine Gesichter -->
      <g class="person">
        <circle cx="74" cy="196" r="20" fill="#e2e8f0"/>
        <path d="M54 194a20 20 0 0 1 40 0q-20-9-40 0z" fill="#475569"/>
        <path d="M48 300v-64a26 26 0 0 1 52 0v64z" fill="#64748b"/>
        <path d="M56 300h16v34H56zM76 300h16v34H76z" fill="#334155"/>
      </g>
      <g class="person zweite">
        <circle cx="566" cy="196" r="20" fill="#e2e8f0"/>
        <path d="M546 194a20 20 0 0 1 40 0q-20-9-40 0z" fill="#78350f"/>
        <path d="M540 300v-64a26 26 0 0 1 52 0v64z" fill="var(--marke)"/>
        <path d="M548 300h16v34h-16zM568 300h16v34h-16z" fill="#334155"/>
        <path id="arm" d="M546 246l-22 20" stroke="var(--marke)" stroke-width="14" stroke-linecap="round" opacity="0"/>
      </g>

      <!-- Sprechblase des Käufers -->
      <g class="blase">
        <path d="M110 26h252a18 18 0 0 1 18 18v66a18 18 0 0 1-18 18H160l-50 44 12-44h-12a18 18 0 0 1-18-18V44a18 18 0 0 1 18-18z" fill="#f8fafc"/>
        <text class="blase-text" id="blase" x="236" y="70" text-anchor="middle"></text>
        <text class="blase-text" id="blase2" x="236" y="100" text-anchor="middle"></text>
      </g>

      <!-- Fragezeichen oder Haken über dem Verkäufer -->
      <g class="zeichen" id="zeichen"></g>

      <!-- Antwort: Handy mit dem Serviceheft-PDF aus der App -->
      <g class="handy" id="handy" style="display:none">
        <rect x="440" y="120" width="96" height="170" rx="13" fill="#0f172a" stroke="#cbd5e1" stroke-width="3"/>
        <rect x="447" y="132" width="82" height="146" rx="4" fill="#ffffff"/>
        <rect x="447" y="132" width="82" height="20" fill="var(--marke)"/>
        <text class="handy-text" id="handy-titel" x="488" y="146" text-anchor="middle" font-size="10" fill="#ffffff"></text>
        <g id="zeilen"></g>
        <rect x="498" y="256" width="26" height="15" rx="3" fill="#dc2626"/>
        <text class="handy-text" x="511" y="267" text-anchor="middle" font-size="9" fill="#ffffff">PDF</text>
      </g>
    </svg>
  </div>
<script>
  const q = new URLSearchParams(location.search)
  const antwort = q.has('antwort')
  // Sprache des Films (?sprache=fr), Titel wie der Sprechertext. Die Blase kommt ohne Sie und ohne Du aus: die
  // Marke duzt, ein fremder Käufer würde siezen. Keine Zeitangaben (Regel im Skill werbefilm).
  // Handy-Titel wie der Knopf «Serviceheft für den Verkauf» der App (src/texte/app/fahrzeugseite.ts), gekürzt.
  const TEXTE = {
    de: { frage: ['Gibt es ein', 'Serviceheft?'], da: 'Alles da.', titel: 'Du willst dein Auto verkaufen.', belegt: 'Alles belegt, alles auf dem Handy.', handy: 'Serviceheft' },
    fr: { frage: ['Il y a un carnet', 'd’entretien ?'], da: 'Tout est là.', titel: 'Tu veux vendre ta voiture.', belegt: 'Tout est justifié, tout est sur le téléphone.', handy: 'Carnet d’entretien' },
    it: { frage: ['C’è il libretto', 'di manutenzione?'], da: 'C’è tutto.', titel: 'Vuoi vendere la tua auto.', belegt: 'Tutto documentato, tutto sul telefono.', handy: 'Libretto' },
    en: { frage: ['Is there a', 'service book?'], da: 'It’s all here.', titel: 'You want to sell your car.', belegt: 'All documented, all on your phone.', handy: 'Service book' },
  }
  const sprache = TEXTE[q.get('sprache')] ? q.get('sprache') : 'de'
  const tx = TEXTE[sprache]
  document.documentElement.lang = sprache
  document.getElementById('blase').textContent = antwort ? tx.da : tx.frage[0]
  document.getElementById('blase2').textContent = antwort ? '' : tx.frage[1]
  // Einzeilige Antwort mittig in der Blase
  if (antwort)
    document.getElementById('blase').setAttribute('y', '85')
  document.getElementById('titel').textContent = antwort ? tx.belegt : tx.titel
  document.getElementById('zeichen').innerHTML = antwort
    ? '<circle cx="566" cy="146" r="22" fill="#10b981" opacity=".2"/><path d="M555 146l8 9 14-17" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<circle cx="566" cy="146" r="22" fill="#f59e0b" opacity=".2"/><text x="566" y="156" text-anchor="middle" font-size="30" font-weight="700" fill="#f59e0b" font-family="Segoe UI, system-ui, sans-serif">?</text>'
  if (antwort) {
    document.getElementById('handy').style.display = ''
    document.getElementById('arm').setAttribute('opacity', '1')
    const handyTitel = document.getElementById('handy-titel')
    handyTitel.textContent = tx.handy
    // Lange Titel (Carnet d'entretien) passen sonst nicht in den grünen Kopf
    if (tx.handy.length > 12)
      handyTitel.setAttribute('font-size', '7.5')
    // Zeilen des Auszugs: Haken und Textbalken, wie die Wartungshistorie im PDF
    let zeilen = ''
    for (let i = 0; i < 5; i++) {
      const y = 166 + i * 18
      zeilen += `<circle cx="457" cy="${y}" r="4.5" fill="#10b981"/><path d="M455 ${y}l1.6 1.8 3-3.4" stroke="#fff" stroke-width="1.4" fill="none"/>`
        + `<rect x="466" y="${y - 3}" width="${54 - (i % 2) * 14}" height="3" rx="1.5" fill="#94a3b8"/><rect x="466" y="${y + 3}" width="30" height="2.5" rx="1.2" fill="#cbd5e1"/>`
    }
    document.getElementById('zeilen').innerHTML = zeilen
  }
</script>
</body>
</html>
