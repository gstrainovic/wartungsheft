# Filme von Wartungsheft für die Regeln im User-Skill `produktvideos`, geprüft vom Paket ~/projects/produktvideo
# (pytest-Plugin produktvideo.regeln):
#   cd video-scripts && uv run --with pytest --with-editable ~/projects/produktvideo pytest produktvideo.toml
# Handy-App: jede Fassung als Handy (hoch, App in Originalgrösse) und Desktop (quer, mit Zoom), Wahl per
# Bildschirmbreite. Montage und Sprecher in scripts/werbefilm.ts und src/lib/sprecher.ts. Lücken stehen als
# [[film.luecke]] mit Grund und laufen als xfail; eine behobene Lücke hier streichen.

[[film]]
name = "privat"
seite = "wartungsheft-privat"
art = "handy-app"
formate = [
  "hoch",
  "quer"
]
sprachen = [
  "de",
  "fr",
  "it",
  "en"
]
oberflaechen = [ "wartungsheft" ]
komposition = "../scripts/werbefilm.ts"
bild = "PRIVAT_BILD"
lesbar = [
  { ziel = "szene-2-rechnung-fotografieren-felder-fuellen-sich", was = "Felder der fotografierten Rechnung" },
  { ziel = "szene-3-faelligkeit-auf-dem-dashboard-und-erledigt-eintragen", was = "Fälligkeit in der Übersicht" },
]
sprecher = { auswahl = "sprecher-auswahl.json", ordner = "../video-out/sprecher", mindestens = 13 }

[film.dateien]
hoch = "../public/film-{name}{suffix}"
quer = "../public/film-{name}{suffix}-desktop"
untertitel = "../public/film-{name}{suffix}"

[[film.luecke]]
regel = "untertitel_srt"
grund = "SRT für YouTube liegt nicht im Repo (Werbefilme liefern nur die VTT der Website nach public/)"

[[film.luecke]]
regel = "freigaben"
grund = "Abnahme laut produktvideos-stand.md offen (Fassung mit Effekten und Fahrt), Freigabedaten nicht festgehalten"

