#   cd video-scripts && uv run --with pytest --with-editable ~/projects/produktvideo pytest produktvideo.toml
# Handy-App: jede Fassung als Handy (hoch, App in Originalgrösse) und Desktop (quer, mit Zoom), Wahl per
# Bildschirmbreite. Montage und Sprecher in scripts/werbefilm.ts und src/lib/sprecher.ts. Lücken stehen als
